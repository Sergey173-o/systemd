pid /run/nginx-first.pid;
worker_processes auto;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 9001;
        server_name _;

        location / {
            return 200 "nginx instance: first (port 9001)\n";
        }
    }
}
